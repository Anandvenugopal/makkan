<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packages — BrainTest (sample)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,500,20,0;9..144,600,20,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .pricing{background:#fff;padding:72px 0 96px}
      .pkg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:36px}

      /* Package cards follow the test cards: cream at rest, deep green on hover */
      .pkg{display:flex;flex-direction:column;background:var(--cream);border:1px solid #e3eae3;border-radius:12px;padding:26px 24px 24px;transition:transform .25s,box-shadow .25s,border-color .3s,background .3s,color .3s;animation:pkgIn .4s both}
      .pkg:hover,.pkg:focus-within{transform:translateY(-4px);box-shadow:0 22px 45px #183f3d40;background:#183f3d;border-color:#183f3d;color:#fff}
      @keyframes pkgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .pkg :is(.pkg-label,.pkg-count,p,.pkg-list li,.pkg-list li:before,.pkg-price,.pkg-was,.pkg-save){transition:color .3s,background .3s,border-color .3s}
      .pkg-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
      .pkg-label{font-size:10px;letter-spacing:.16em;font-weight:700;color:#49776c;text-transform:uppercase}
      .pkg.featured .pkg-label{color:#c07a4d}
      .pkg-count{font-size:11px;font-weight:700;color:#93a39b}
      .pkg h3{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.15;letter-spacing:-.03em;margin:14px 0 8px}
      .pkg p{margin:0;color:#6c7d77;font-size:13px;line-height:1.6}
      .pkg-list{list-style:none;margin:18px 0 0;padding:16px 0 0;border-top:1px solid #e3eae3;display:grid;gap:9px}
      .pkg-list li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;color:#334a44;line-height:1.4}
      .pkg-list li:before{content:"✓";color:#3f8a64;font-weight:700}
      .pkg-list small{display:block;font-size:11px;color:#8ea69b}
      .pkg-foot{margin-top:auto;padding-top:20px}
      .pkg-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid #e3eae3;padding-top:16px}
      .pkg-now{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1}
      .pkg-was{font-size:14px;color:#93a39b;text-decoration:line-through;text-decoration-color:#d3976d}
      .pkg-save{display:block;width:100%;font-size:11px;font-weight:700;color:#c07a4d;margin-top:6px}
      .pkg .button{width:100%;min-width:0;margin-top:16px;padding:15px 18px}
      .pkg:is(:hover,:focus-within) :is(.pkg-label,.pkg-save){color:#ecad83}
      .pkg:is(:hover,:focus-within) .pkg-count{color:#7fa89a}
      .pkg:is(:hover,:focus-within) p,.pkg:is(:hover,:focus-within) .pkg-list small{color:#bbcfca}
      .pkg:is(:hover,:focus-within) .pkg-list li{color:#e7f0eb}
      .pkg:is(:hover,:focus-within) .pkg-list li:before{color:#a8d4ad}
      .pkg:is(:hover,:focus-within) :is(.pkg-list,.pkg-price){border-color:#335e5a}
      .pkg:is(:hover,:focus-within) .pkg-was{color:#8fb0a6}
      .pkg:is(:hover,:focus-within) .button-primary{background:#e7f3e8;color:#194640}

      .single-note{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:40px;padding:22px 26px;border:1px solid #e3eae3;border-radius:12px;background:#fafbf8}
      .single-note strong{font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.02em}
      .single-note span{display:block;font-size:13px;color:#6c7d77;margin-top:4px}
      .single-note .button{min-width:0}

      @media(max-width:1100px){.pkg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media(max-width:760px){.pricing{padding:48px 0 72px}.single-note{flex-direction:column;align-items:flex-start}}
      @media(max-width:560px){.pkg-grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="home-option-b.html" aria-label="BrainTest home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          <span>brain<span class="brand-accent">test</span><span class="brand-dot">.</span></span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a class="nav-link" href="home-option-b.html">Home</a>
          <a class="nav-link" href="tests-sample.html">Tests</a>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link active" href="pricing.html" aria-current="page">Pricing</a>
        </nav>
      </div>
    </header>

    <main class="pricing">
      <div class="container">
        <div class="catalog-head">
          <div>
            <div class="section-kicker"><span></span> PACKAGES</div>
            <h2>Better together, <em>for less.</em></h2>
          </div>
          <p>Each package bundles tests that work well side by side, so you get a fuller picture and pay less than buying them one at a time.</p>
        </div>

        <div class="tabbar">
          <div class="tabs" role="tablist" aria-label="Choose who the packages are for">
            <button class="tab" type="button" role="tab" data-audience="adult" aria-controls="pkg-grid">For adults<sup>04</sup></button>
            <button class="tab" type="button" role="tab" data-audience="student" aria-controls="pkg-grid">For students<sup>04</sup></button>
          </div>
          <span class="tab-count" aria-live="polite"></span>
        </div>

        <div class="pkg-grid" id="pkg-grid" role="tabpanel"></div>

        <div class="single-note">
          <div><strong>Only need one test?</strong><span>Every test is also available on its own.</span></div>
          <a class="button button-primary" id="single-link" href="tests-sample.html">See single tests <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </main>

    <script src="data/tests-data.js"></script>
    <script src="js/catalog.js"></script>
    <script>
      const { tests: TESTS, packages: PACKAGES } = window.BRAIN_CATALOG;
      const DATA = window.TEST_DATA || {};
      const byId = Object.fromEntries(Object.values(TESTS).flat().map((t) => [t.id, t]));
      const inr = (n) => '₹' + n.toLocaleString('en-IN');
      const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const grid = document.getElementById('pkg-grid');
      const tabs = document.querySelectorAll('.tab');
      const count = document.querySelector('.tab-count');

      // Real question count for a test (composites include their component tests)
      function questions(id) {
        const d = DATA[id];
        if (!d) return 0;
        const own = (d.sections || []).reduce((n, s) => n + (s.questions || []).length, 0);
        return own + (d.componentsOf || []).reduce((n, c) => n + questions(c), 0);
      }

      function render(audience) {
        const list = PACKAGES[audience];
        grid.innerHTML = list.map((p, i) => {
          const separately = p.tests.reduce((s, id) => s + byId[id].price, 0);
          const saved = separately - p.price;
          return `<article class="pkg${p.featured ? ' featured' : ''}" style="animation-delay:${i * 50}ms">
            <div class="pkg-top"><span class="pkg-label">${p.featured ? 'Best value' : `Package ${String(i + 1).padStart(2, '0')}`}</span><span class="pkg-count">${p.tests.length} tests</span></div>
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.tagline)}</p>
            <ul class="pkg-list">${p.tests.map((id) => `<li><span>${esc(byId[id].title)}<small>${questions(id)} questions${id === 'focus-attention' ? ' · answered by a parent' : ''}</small></span></li>`).join('')}</ul>
            <div class="pkg-foot">
              <div class="pkg-price">
                <span class="pkg-now">${inr(p.price)}</span>
                <s class="pkg-was">${inr(separately)}</s>
                <span class="pkg-save">Save ${inr(saved)} (${Math.round((saved / separately) * 100)}%) vs buying separately</span>
              </div>
              <a class="button button-primary" href="take-test.html?test=${p.tests[0]}">Choose package <span aria-hidden="true">↗</span></a>
            </div>
          </article>`;
        }).join('');
        tabs.forEach((t) => {
          const on = t.dataset.audience === audience;
          t.setAttribute('aria-selected', String(on));
          t.tabIndex = on ? 0 : -1;
        });
        count.innerHTML = `Showing <strong>${list.length}</strong> packages for ${audience === 'adult' ? 'adults' : 'students'}`;
        document.getElementById('single-link').href = 'tests-sample.html' + (audience === 'student' ? '#students' : '');
      }

      tabs.forEach((t) => (t.onclick = () => { history.replaceState(null, '', t.dataset.audience === 'student' ? '#students' : '#'); render(t.dataset.audience); }));
      render(location.hash === '#students' ? 'student' : 'adult');
    </script>
  </body>
</html>
